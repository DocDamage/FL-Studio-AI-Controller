name: Core tests
on: [push, pull_request, workflow_dispatch]
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact source under test
        if: matrix.os == 'ubuntu-latest'
        run: git archive --format=zip --output=source-under-test.zip HEAD
      - name: Retain source snapshot
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: source-${{ github.sha }}
          path: source-under-test.zip
          retention-days: 7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q tests
      - run: python scripts/verify_runtime.py
# These are core/fixture tests, not live FL Studio acceptance or signed installer builds.
